name: Update SideStore source

on:
  release:
    types: [published, edited]
  # Catches releases whose IPA was uploaded after publishing.
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sidestore-source
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'NextendoNetwork/Nextendo-App-Ios'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Rebuild sidestore/source.json from releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/update_sidestore_source.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- sidestore/source.json; then
            echo "Source already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sidestore/source.json
          git commit -m "Update SideStore source"
          git push origin HEAD:main
